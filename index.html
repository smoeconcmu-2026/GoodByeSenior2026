<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Bye Senior - Best Dressed 🌟</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        theme: {
                            pink: '#ff4b98',
                            purple: '#9b4dff',
                            dark: '#0f0518',
                            card: 'rgba(255, 255, 255, 0.05)',
                        }
                    },
                    animation: {
                        'twinkle': 'twinkle 3s ease-in-out infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        twinkle: {
                            '0%, 100%': { opacity: 0.3, transform: 'scale(0.8)' },
                            '50%': { opacity: 1, transform: 'scale(1.2)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f0518;
            background-image: 
                radial-gradient(at 0% 0%, rgba(155, 77, 255, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(255, 75, 152, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(155, 77, 255, 0.3) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(255, 75, 152, 0.3) 0px, transparent 50%);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Starry Background Container */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration, 3s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        /* Hide scrollbar for cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 75, 152, 0.5); 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 75, 152, 0.8); 
        }
        
        .progress-bar-fill {
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="antialiased font-sans flex flex-col items-center">

    <div id="stars-container"></div>

    <header class="w-full max-w-4xl mx-auto p-6 flex flex-col md:flex-row justify-between items-center gap-4 relative z-10">
        <div class="text-center md:text-left animate-float">
            <h1 class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-theme-pink to-theme-purple">
                <i class="fa-solid fa-star text-theme-pink text-2xl md:text-3xl mr-2"></i>
                Good Bye Senior
            </h1>
            <p class="text-gray-300 text-sm md:text-base mt-1">โหวตการแต่งกายยอดเยี่ยม (Best Dressed)</p>
        </div>
        
        <nav class="glass-panel p-1 rounded-full flex gap-1">
            <button id="nav-vote" onclick="switchTab('vote')" class="px-6 py-2 rounded-full text-sm font-medium transition-all duration-300 bg-gradient-to-r from-theme-pink to-theme-purple shadow-lg shadow-theme-pink/30">
                <i class="fa-solid fa-check-to-slot mr-2"></i> โหวต
            </button>
            <button id="nav-dash" onclick="switchTab('dashboard')" class="px-6 py-2 rounded-full text-sm font-medium text-gray-300 hover:text-white transition-all duration-300">
                <i class="fa-solid fa-chart-simple mr-2"></i> ผลโหวต
            </button>
        </nav>
    </header>

    <main class="w-full max-w-4xl mx-auto p-4 md:p-6 pb-20 relative z-10 flex-grow">

        <div id="voted-banner" class="hidden mb-8 glass-panel rounded-2xl p-6 text-center border-theme-pink/50 border relative overflow-hidden">

            <div class="absolute -left-10 -bottom-10 w-40 h-40 bg-theme-purple/20 rounded-full blur-3xl"></div>
            
            <div class="w-16 h-16 mx-auto bg-gradient-to-br from-theme-pink to-theme-purple rounded-full flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(255,75,152,0.4)]">
                <i class="fa-solid fa-check text-2xl text-white"></i>
            </div>
            <h2 class="text-xl md:text-2xl font-bold text-white mb-2">คุณได้ทำการโหวตเรียบร้อยแล้ว!</h2>
            <p class="text-gray-300 text-lg">ขอบคุณที่ร่วมโหวต คุณได้โหวตให้กับ <span id="voted-table-num" class="font-bold text-theme-pink text-xl">โต๊ะ ?</span></p>
            <button onclick="switchTab('dashboard')" class="mt-6 px-6 py-2 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 transition-all">
                ดูผลโหวตปัจจุบัน <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>

        <!-- Voting View -->
        <section id="view-vote" class="w-full transition-opacity duration-500">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-2xl font-semibold text-white">เลือกโต๊ะที่คุณชื่นชอบ</h2>
                    <p class="text-gray-400 text-sm mt-1">กรุณาเลือกตัวแทนจากโต๊ะเพื่อโหวต (1 เครื่อง / 1 สิทธิ์)</p>
                </div>
            </div>

            <!-- Loading State -->
            <div id="vote-loading" class="flex flex-col items-center justify-center py-20">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-theme-pink mb-4"></i>
                <p class="text-gray-400">กำลังโหลดข้อมูล...</p>
            </div>

            <!-- Candidates Grid -->
            <div id="candidates-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 hidden">
                <!-- Dynamically populated by JS -->
            </div>
        </section>

        <section id="view-dashboard" class="w-full hidden opacity-0 transition-opacity duration-500">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-theme-pink to-theme-purple inline-block">
                    ผลคะแนน Real-time
                </h2>
                <p class="text-gray-400 text-sm mt-2">อัปเดตคะแนนล่าสุดโดยอัตโนมัติ</p>
            </div>

            <!-- Top 3 Podium -->
            <div id="podium-container" class="flex justify-center items-end gap-2 md:gap-6 mb-12 h-64 mt-10">

                <div class="flex flex-col items-center w-1/3 max-w-[120px] animate-float" style="animation-delay: 0.2s;">
                    <div class="glass-panel p-2 rounded-full mb-2 border-gray-300/50 shadow-[0_0_15px_rgba(255,255,255,0.2)]">

                            <span class="text-xl md:text-2xl font-bold text-gray-300" id="podium-2-table">-</span>
                        </div>
                    </div>
                    <div class="w-full bg-gradient-to-t from-gray-600/50 to-gray-400/30 rounded-t-lg flex flex-col items-center justify-start pt-4 h-32 border-t border-x border-gray-400/30">
                        <span class="text-2xl font-bold text-gray-300">2nd</span>
                        <span class="text-sm text-gray-400 mt-1" id="podium-2-score">0 โหวต</span>
                    </div>
                </div>

                <!-- Rank 1 -->
                <div class="flex flex-col items-center w-1/3 max-w-[140px] animate-float z-10">
                    <div class="fa-solid fa-crown text-yellow-400 text-3xl mb-1 filter drop-shadow-[0_0_10px_rgba(250,204,21,0.8)]"></div>
                    <div class="glass-panel p-2 rounded-full mb-2 border-yellow-400/50 shadow-[0_0_20px_rgba(250,204,21,0.4)]">
                        <div class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-gradient-to-br from-yellow-300 to-yellow-600 flex items-center justify-center">
                            <span class="text-2xl md:text-3xl font-bold text-white shadow-sm" id="podium-1-table">-</span>
                        </div>
                    </div>
                    <div class="w-full bg-gradient-to-t from-yellow-900/50 to-yellow-600/30 rounde
